  intro: 羊宫妃那是日本新生代声优，隶属于青二プロダクション。她以清澈透明的声线和广泛的音域著称，能够出色演绎从少女到成熟女性的各类角色。在配音工作中，她注重情感表达和角色契合度，通过细腻的语气变化展现人物内心世界。其扎实的演技和持续进步的专业态度，使她在业内获得良好口碑。作为声优界的新星，她积极参与广播节目和线下活动，展现了多才多艺的一面。
  name: 羊宫妃那
date: '2026-03-12'
